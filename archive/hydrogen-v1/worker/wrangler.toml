name = "hydrogen-api"
main = "src/index.ts"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

# 允许的前端来源。CORS 白名单，不用 * ——
# 评论接口带 credentials，通配来源会被浏览器直接拒掉，
# 而且那样任何站点都能拿着用户的 cookie 调这个 API。
[vars]
ALLOWED_ORIGINS = "https://hydrogen.puresky.dev,http://localhost:4321,http://127.0.0.1:4321"
SITE_ORIGIN = "https://hydrogen.puresky.dev"
# 站长的 GitHub 登录名。用于给作者本人的评论加标记、以及放行管理接口。
OWNER_LOGIN = "puresky"
# 评论是否需要人工/自动审核后才显示。
MODERATION_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "hydrogen"
# 用 `wrangler d1 create hydrogen` 建库后把返回的 id 填进来。
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "SESSIONS"
# 用 `wrangler kv namespace create SESSIONS` 建后填 id。
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "hydrogen-media"

# 评论审核用 Workers AI。免费额度足够个人博客的量。
[ai]
binding = "AI"

# 速率限制。Cloudflare 原生的限流绑定，不需要自己用 Durable Object 实现。
[[unsafe.bindings]]
name = "COMMENT_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "AUTH_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[observability]
enabled = true

# 以下是密钥，不写在这里。用 wrangler secret put 设置：
#   wrangler secret put GITHUB_CLIENT_ID
#   wrangler secret put GITHUB_CLIENT_SECRET
#   wrangler secret put SESSION_SECRET
