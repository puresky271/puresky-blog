name = "puresky-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# 自定义域名：wrangler deploy 时自动建 DNS 记录和证书（zone 在同一账号下）。
routes = [{ pattern = "api.pureskyblog.dpdns.org", custom_domain = true }]
# 同时保留 workers.dev 地址，自定义域名出问题时可以直接用它排查。
workers_dev = true

# 允许的前端来源。CORS 白名单，不用 * ——
# 评论接口带 credentials，通配来源会被浏览器直接拒掉，
# 而且那样任何站点都能拿着用户的 cookie 调这个 API。
[vars]
ALLOWED_ORIGINS = "https://pureskyblog.dpdns.org,https://pureskyblog.1601992191.workers.dev,http://localhost:4321,http://127.0.0.1:4321"
SITE_ORIGIN = "https://pureskyblog.dpdns.org"
# 站长的 GitHub 登录名。用于给作者本人的评论加标记、放行管理接口。
OWNER_LOGIN = "puresky271"
# 评论是否需要审核后才显示。
MODERATION_ENABLED = "true"
# GitHub 概览只代理这个账号，避免被当成任意用户的查询代理。
GITHUB_USERNAME = "puresky271"
# 允许代理的网易云歌单，逗号分隔。和 site/src/config.ts 的 MUSIC.playlistId 保持一致。
MUSIC_PLAYLISTS = "8385925605"

[[d1_databases]]
binding = "DB"
database_name = "puresky"
database_id = "817f0f31-cb70-4c5a-b30a-11f61d0b4e34"

[[kv_namespaces]]
binding = "SESSIONS"
id = "5091a87310174ac9a4809c15a4e3c308"

[[kv_namespaces]]
binding = "CACHE"
# 第三方接口（GitHub、网易云）的响应缓存。
id = "f490380f94e84f07bf4d2c5cce01e412"

# R2：放不进静态站点的本地曲库（音频、视频，单文件超过 25MB 的）。可选：
# 账号还没开通 R2，暂时不绑定，/media/* 返回 404。开通后（Dashboard → R2）
# 运行 `wrangler r2 bucket create puresky-media`，再取消下面三行的注释并重新部署。
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "puresky-media"

# 评论审核用 Workers AI。
[ai]
binding = "AI"

# 速率限制。Cloudflare 原生的限流绑定。
[[unsafe.bindings]]
name = "COMMENT_LIMITER"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "AUTH_LIMITER"
type = "ratelimit"
namespace_id = "2002"
simple = { limit = 10, period = 60 }

# 只在缓存未命中、真正请求上游时计数。
[[unsafe.bindings]]
name = "PROXY_LIMITER"
type = "ratelimit"
namespace_id = "2003"
simple = { limit = 60, period = 60 }

[observability]
enabled = true

# 以下是密钥，不写在这里。用 wrangler secret put 设置：
#   wrangler secret put GITHUB_CLIENT_ID
#   wrangler secret put GITHUB_CLIENT_SECRET
#   wrangler secret put SESSION_SECRET
#   wrangler secret put GITHUB_TOKEN        可选；有它 GitHub 面板走 GraphQL，拿得到精确的贡献日历和个人状态
